[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations", "venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "SIM", "RUF"]
ignore = [
    "RUF012",  # Django's Meta.indexes/constraints/fields are conventionally mutable class attrs
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations"
