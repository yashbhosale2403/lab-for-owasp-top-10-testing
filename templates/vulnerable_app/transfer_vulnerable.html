{% extends "vulnerable_app/base.html" %}
{% block title %}Redeem Gift Card &mdash; ByteForge{% endblock %}
{% block content %}
<h1>Redeem a gift card</h1>
<p class="lede">Enter your gift card note or message to apply it to your account.</p>
<div class="card" style="max-width: 420px;">
    <form method="post" action="{% url 'transfer_vulnerable' %}" onsubmit="return submitFormViaFetch(event, 'Gift Card Redeemed')">
        <div class="field">
            <label for="note">Gift card note</label>
            <input type="text" id="note" name="note">
        </div>
        <button class="btn" type="submit">Redeem</button>
    </form>
</div>
{% endblock %}
